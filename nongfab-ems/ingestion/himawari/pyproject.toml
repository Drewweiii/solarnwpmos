[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "himawari-ingestion"
version = "0.1.0"
description = "Module 1 of Nong Fab EMS: Himawari cloud-observation ingestion service"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "apscheduler>=3.10",
  "minio>=7.2",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "aiosqlite>=0.20",
]

[project.scripts]
himawari-ingestion = "himawari_ingestion.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real TimescaleDB (set TIMESCALE_TEST_DSN)"]
