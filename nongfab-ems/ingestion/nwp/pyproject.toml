[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nwp-ingestion"
version = "0.1.0"
description = "Module 2 of Nong Fab EMS: NCEP/NOAA GFS NWP ingestion service"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "apscheduler>=3.10",
  "minio>=7.2",
  "prometheus-client>=0.20",
  "xarray>=2024.2",
  "cfgrib>=0.9.15",
  "numpy>=1.26",
  "pandas>=2.2",
  "nongfab-common",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "aiosqlite>=0.20",
]

[project.scripts]
nwp-ingestion = "nwp_ingestion.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nwp_ingestion = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real TimescaleDB (set TIMESCALE_TEST_DSN) and/or live NOMADS access (set NWP_LIVE_TEST=1)"]
