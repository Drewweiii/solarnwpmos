[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-power-ingestion"
version = "0.1.0"
description = "Module 1b of Nong Fab EMS: NASA POWER daily UV index ingestion service"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "nongfab-common",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real TimescaleDB (set TIMESCALE_TEST_DSN) and/or live NASA POWER access (set NASA_POWER_LIVE_TEST=1)"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
