global:
  scrape_interval: 15s

scrape_configs:
  # STEP 10: api/src/nongfab_api/metrics.py + main.py's /metrics route
  # (request count + latency by method/route-template/status).
  - job_name: nongfab-api
    static_configs:
      - targets: ["api:8000"]

  # Not started via this compose file yet (Module 1 has its own dev workflow -
  # see ingestion/himawari/README.md) - scrape target for when it is. Port
  # matches Settings.metrics_port (himawari_ingestion/config.py).
  - job_name: himawari-ingestion
    static_configs:
      - targets: ["himawari-ingestion:9101"]

  # Same situation as himawari-ingestion above (Module 2 has its own dev
  # workflow - see ingestion/nwp/README.md). Port matches Settings.
  # metrics_port (nwp_ingestion/config.py).
  - job_name: nwp-ingestion
    static_configs:
      - targets: ["nwp-ingestion:9102"]
