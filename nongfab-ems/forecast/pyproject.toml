[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nongfab-forecast"
version = "0.1.0"
description = "Module 4 of Nong Fab EMS: 3-horizon forecast engine (minute/hour/day-ahead), PV conversion, MLflow registry"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "optuna>=3.6",
  "mlflow>=2.12",
  "cloudpickle>=3.0",
  "neuralforecast>=1.7",
  "neuralprophet>=0.9",
  "pydantic>=2.6",
  "nongfab-common",
  "nongfab-features",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: trains a real (tiny) neural model - slower than pure unit tests"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
