[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nongfab-api"
version = "0.2.0"
description = "Module 6 of Nong Fab EMS: Backend API - REST (/assets, /forecast, /simulate, /performance), WebSocket (/ws/live), JWT/RBAC auth"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "aiosqlite>=0.20",  # SQLite async driver - the zero-setup auth store for a public demo deploy (see config.create_tables_on_startup)
  "nongfab-common",
  "nongfab-features",
  "nongfab-forecast",
  "nongfab-simulation",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]

[project.scripts]
nongfab-api = "nongfab_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real Postgres database (set API_TEST_DSN)"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
