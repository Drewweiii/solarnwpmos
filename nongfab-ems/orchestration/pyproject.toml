[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nongfab-orchestration"
version = "0.1.0"
description = "Cross-cutting: Prefect flows orchestrating the ingestion (Module 1/2) -> retrain (Module 4) pipeline"
requires-python = ">=3.11"
dependencies = [
  "prefect>=3.0",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "himawari-ingestion",
  "nwp-ingestion",
  "nongfab-forecast",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
nongfab-orchestration-serve = "nongfab_orchestration.deploy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
