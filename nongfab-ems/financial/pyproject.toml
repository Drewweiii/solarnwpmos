[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nongfab-financial"
version = "0.1.0"
description = "Module 11 of Nong Fab EMS: NPV/IRR/LCOE/payback investment analysis, reusing simulation's energy-yield model"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.6",
  "nongfab-simulation",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
