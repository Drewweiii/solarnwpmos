[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nongfab-features"
version = "0.1.0"
description = "Module 3 of Nong Fab EMS: feature store & preprocessing (clear-sky, lag/EMA features, QC, multi-step framing)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pvlib>=0.10",
  "nongfab-common",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
