[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nongfab-simulation"
version = "0.1.0"
description = "Module 5 of Nong Fab EMS: what-if scenarios, Monte Carlo prediction intervals, PVWatts-style loss model (on-grid, no battery)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.6",
  "nongfab-common",
  "nongfab-features",
  "nongfab-forecast",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
