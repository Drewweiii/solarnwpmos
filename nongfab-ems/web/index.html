<!doctype html>
<!-- lang was "en" until 2026-07-26 (project P) while the interface is almost
     entirely Thai. It is not cosmetic: the browser picks its line-breaking
     rules and font fallbacks from it, Thai writes without spaces between words
     so it needs the Thai dictionary breaker, and a screen reader was reading
     Thai text in an English voice. -->
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTT LNG Terminal 2 Nong Fab Solar Forecasting</title>
    <meta
      name="description"
      content="ระบบพยากรณ์และวิเคราะห์การผลิตไฟฟ้าจากแสงอาทิตย์ 429 kWp ที่ PTT LNG Terminal 2 (หนองแฟบ) — พยากรณ์ล่วงหน้า วัดความแม่นยำจริง และตามรอยที่มาของทุกตัวเลขได้"
    />
    <!-- Only the weights that carry the first paint: 400 for body text and 600,
         which this stylesheet uses more than all the others combined. Thai and
         Latin are separate files and both are needed immediately, because
         almost every screen mixes the two scripts in one sentence. 500 and 700
         load on demand - preloading all eight would spend exactly the bandwidth
         the subsetting exists to save. -->
    <link rel="preload" href="/fonts/plex-thai-400-thai.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-thai-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-thai-600-thai.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-thai-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Theme, applied before first paint (2026-07-26, project R).

         Synchronous and inline on purpose. If this ran with the app bundle the
         page would paint light and then snap to dark, which is the flash every
         theme toggle is judged by. Because it always stamps data-theme, the
         stylesheet can keep the dark palette in one attribute rule instead of
         duplicating it between a media query and a selector - see
         src/lib/theme.ts. Kept deliberately tiny and dependency-free; the
         typed logic it mirrors lives in that module and is unit-tested. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('nongfab_ems_theme')
          var pref = ['auto', 'light', 'dark', 'present'].indexOf(stored) >= 0 ? stored : 'auto'
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = pref === 'auto' ? (dark ? 'dark' : 'light') : pref
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
