name: CI

on:
  push:
  pull_request:

# This workflow file must live at the true repo root's .github/workflows/ (not
# nongfab-ems/.github/workflows/) for GitHub Actions to ever pick it up at all -
# it sat inert there for a while (0 runs ever) before this was caught, since the
# actual git repo root is one level above nongfab-ems/ (it also holds unrelated
# pre-existing research files - MATLAB/PDF - from before this project started;
# see root README.md's own note on this). `defaults.run.working-directory`
# below points every job's `run:` steps at nongfab-ems/ so the relative paths
# throughout this file (e.g. `./libs/nongfab_common`) don't all need an
# `nongfab-ems/` prefix - a handful of non-`run:` action inputs still need one
# explicitly (cache-dependency-path, docker build context/file - see below).
# No `branches:` filter on `push` (unlike this file's original `[master]`,
# which never matched the actual working branch): the real development
# happens on a per-session feature branch, not master, so restricting to one
# named branch would just recreate the "CI never runs" problem.
defaults:
  run:
    working-directory: nongfab-ems

# Every Python job installs its own sibling packages *editable* (`pip install -e`)
# straight from this checkout, in dependency order (nongfab-common -> features ->
# forecast -> simulation -> financial -> api; ingestion/orchestration branch off
# nongfab-common too). That's deliberate, not an oversight: none of these packages are published to
# PyPI, so an editable install is what lets a bare `nongfab-common` requirement in
# e.g. api/pyproject.toml resolve to the sibling checked out right here instead of
# pip trying (and failing) to fetch it from the index. Editable also keeps each
# package's __file__ pointing at this checkout, which nongfab_common.assets.
# load_assets()'s default path resolution depends on - see orchestration/README.md's
# "A real packaging bug this module caught" for what goes wrong with a *non*-editable
# install sharing a venv with another package (not what happens here - each job below
# gets its own clean runner - but worth knowing if this workflow ever changes).

jobs:
  nongfab-common:
    name: lint+test - libs/nongfab_common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff -e "./libs/nongfab_common[dev]"
      - run: ruff check libs/nongfab_common/src libs/nongfab_common/tests
      - run: pytest libs/nongfab_common -v

  features:
    name: lint+test - features/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff -e ./libs/nongfab_common -e "./features[dev]"
      - run: ruff check features/src features/tests
      - run: pytest features -v

  forecast:
    name: lint+test - forecast/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff -e ./libs/nongfab_common -e ./features -e "./forecast[dev]"
      - run: ruff check forecast/src forecast/tests
      - run: pytest forecast -v -m "not slow"

  simulation:
    name: lint+test - simulation/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff -e ./libs/nongfab_common -e ./features -e ./forecast -e "./simulation[dev]"
      - run: ruff check simulation/src simulation/tests
      - run: pytest simulation -v

  financial:
    name: lint+test - financial/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff -e ./libs/nongfab_common -e ./features -e ./forecast -e ./simulation -e "./financial[dev]"
      - run: ruff check financial/src financial/tests
      - run: pytest financial -v

  api:
    name: lint+test - api/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: >
          pip install ruff
          -e ./libs/nongfab_common -e ./features -e ./forecast -e ./simulation -e ./financial
          -e ./ingestion/nwp -e ./ingestion/himawari -e ./ingestion/nasa_power -e ./ingestion/pvgis
          -e "./api[dev]"
      - run: ruff check api/src api/tests
      - run: pytest api -v

  himawari-ingestion:
    name: lint+test - ingestion/himawari
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff -e ./libs/nongfab_common -e "./ingestion/himawari[dev]"
      - run: ruff check ingestion/himawari/src ingestion/himawari/tests
      - run: pytest ingestion/himawari -v

  nwp-ingestion:
    name: lint+test - ingestion/nwp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff -e ./libs/nongfab_common -e "./ingestion/nwp[dev]"
      - run: ruff check ingestion/nwp/src ingestion/nwp/tests
      - run: pytest ingestion/nwp -v

  pvgis-ingestion:
    name: lint+test - ingestion/pvgis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff -e ./libs/nongfab_common -e "./ingestion/pvgis[dev]"
      - run: ruff check ingestion/pvgis/src ingestion/pvgis/tests
      - run: pytest ingestion/pvgis -v

  orchestration:
    name: lint+test - orchestration/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: >
          pip install ruff
          -e ./libs/nongfab_common -e ./features -e ./forecast
          -e ./ingestion/himawari -e ./ingestion/nwp
          -e "./orchestration[dev]"
      - run: ruff check orchestration/src orchestration/tests
      - run: pytest orchestration -v -m "not slow"

  web:
    name: lint+test+build - web/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nongfab-ems/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nongfab-ems/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  docker-compose-config:
    name: validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  hf-dockerfile-in-sync:
    name: Hugging Face Dockerfile matches api/Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # nongfab-ems/Dockerfile is the Hugging Face Space entrypoint and is a
      # copy of api/Dockerfile below its header comment (HF only builds a
      # `Dockerfile` at the Space root, and its builder may not follow
      # symlinks). Duplication that nobody checks is duplication that drifts,
      # and the failure mode is the production API silently running a stale
      # image - so the copy is asserted here instead of trusted.
      - name: The copy must match api/Dockerfile below its header
        run: |
          cd nongfab-ems
          tail -n +17 Dockerfile > /tmp/hf-body
          if ! diff -u api/Dockerfile /tmp/hf-body; then
            echo "::error::nongfab-ems/Dockerfile has drifted from api/Dockerfile."
            echo "Edit api/Dockerfile, then re-copy: cp api/Dockerfile Dockerfile and re-add the header."
            exit 1
          fi

  docker-build-api:
    name: build api/ Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: nongfab-ems
          file: nongfab-ems/api/Dockerfile
          push: false
          tags: nongfab-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
